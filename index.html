<script>
// ========== CONFIGURAZIONE ==========
const WORKER_URL = "https://streamdockedo.edoardo-melzi.workers.dev";

// ========== STATO ==========
let state = {
  yt: { connected: false, accessToken: null, refreshToken: null, liveChatId: null, channelName: null, viewers: 0 },
  tw: { connected: false, channel: null, viewers: 0, ws: null },
  messages: [],
  filter: 'all'
};

// ========== CARICAMENTO TOKEN SALVATI ==========
window.addEventListener('DOMContentLoaded', async () => {
  // Carica token YouTube salvati
  const savedYT = localStorage.getItem('streamdock_yt');
  if (savedYT) {
    const data = JSON.parse(savedYT);
    state.yt.accessToken = data.accessToken;
    state.yt.refreshToken = data.refreshToken;
    
    // Verifica se il token è scaduto e prova a fare refresh
    if (data.expiresAt && Date.now() > data.expiresAt) {
      await refreshYouTubeToken();
    } else {
      await connectYouTubeWithToken();
    }
  }
  
  // Carica dati Twitch salvati
  const savedTW = localStorage.getItem('streamdock_tw');
  if (savedTW) {
    const data = JSON.parse(savedTW);
    state.tw.channel = data.channel;
    await connectTwitchWithToken();
  }
  
  updateUI();
});

// ========== YOUTUBE: LOGIN ==========
async function connectYT() {
  const clientId = document.getElementById('ytClientId').value.trim();
  if (!clientId) return;
  
  localStorage.setItem('streamdock_yt_client_id', clientId);
  closeModal('ytModal');
  
  // Costruisci URL OAuth
  const scope = "https://www.googleapis.com/auth/youtube.readonly";
  const authUrl = `https://accounts.google.com/o/oauth2/v2/auth?` + new URLSearchParams({
    client_id: clientId,
    redirect_uri: `${WORKER_URL}/token`,
    response_type: 'code',
    scope: scope,
    access_type: 'offline',
    prompt: 'consent'
  });
  
  // Apri popup OAuth
  const popup = window.open(authUrl, 'oauth', 'width=500,height=600');
  
  // Attendi il callback dal Worker
  window.addEventListener('message', async (event) => {
    if (event.data.type === 'yt_token') {
      state.yt.accessToken = event.data.access_token;
      state.yt.refreshToken = event.data.refresh_token;
      
      // Salva in localStorage con scadenza
      localStorage.setItem('streamdock_yt', JSON.stringify({
        accessToken: state.yt.accessToken,
        refreshToken: state.yt.refreshToken,
        expiresAt: Date.now() + (event.data.expires_in * 1000)
      }));
      
      await connectYouTubeWithToken();
      popup.close();
    }
  });
}

// ========== YOUTUBE: CONNESSIONE CON TOKEN ==========
async function connectYouTubeWithToken() {
  if (!state.yt.accessToken) return;
  
  try {
    // Ottieni info canale
    const channelRes = await fetch('https://www.googleapis.com/youtube/v3/channels?part=snippet&mine=true', {
      headers: { 'Authorization': `Bearer ${state.yt.accessToken}` }
    });
    const channelData = await channelRes.json();
    
    if (channelData.items && channelData.items[0]) {
      state.yt.channelName = channelData.items[0].snippet.title;
      state.yt.connected = true;
      
      // Ottieni liveChatId
      const liveRes = await fetch('https://www.googleapis.com/youtube/v3/liveBroadcasts?part=snippet&broadcastStatus=active&mine=true', {
        headers: { 'Authorization': `Bearer ${state.yt.accessToken}` }
      });
      const liveData = await liveRes.json();
      
      if (liveData.items && liveData.items[0]) {
        state.yt.liveChatId = liveData.items[0].snippet.liveChatId;
        startYouTubePolling();
      }
    }
    
    updateUI();
    addSystemMessage('yt', '✅ YouTube connesso (salvato permanentemente)');
  } catch (error) {
    console.error('YouTube connection error:', error);
    if (error.status === 401) await refreshYouTubeToken();
  }
}

// ========== YOUTUBE: REFRESH TOKEN ==========
async function refreshYouTubeToken() {
  if (!state.yt.refreshToken) return;
  
  const response = await fetch(`${WORKER_URL}/refresh`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ refresh_token: state.yt.refreshToken })
  });
  
  const data = await response.json();
  if (data.access_token) {
    state.yt.accessToken = data.access_token;
    localStorage.setItem('streamdock_yt', JSON.stringify({
      accessToken: state.yt.accessToken,
      refreshToken: state.yt.refreshToken,
      expiresAt: Date.now() + (data.expires_in * 1000)
    }));
    await connectYouTubeWithToken();
  }
}

// ========== YOUTUBE: POLLING MESSAGGI ==========
function startYouTubePolling() {
  setInterval(async () => {
    if (!state.yt.liveChatId || !state.yt.accessToken) return;
    
    const response = await fetch(`${WORKER_URL}/messages`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        access_token: state.yt.accessToken,
        liveChatId: state.yt.liveChatId
      })
    });
    
    const data = await response.json();
    if (data.items) {
      data.items.forEach(item => {
        addMessage({
          platform: 'yt',
          author: item.authorDetails.displayName,
          text: item.snippet.displayMessage,
          timestamp: new Date(item.snippet.publishedAt)
        });
      });
      
      // Aggiorna viewer count
      if (data.pollingIntervalMillis) {
        state.yt.viewers = Math.floor(Math.random() * 50) + 10; // Sostituisci con viewer reali
        updateUI();
      }
    }
  }, 5000);
}

// ========== TWITCH: CONNESSIONE ==========
async function connectTwitch() {
  const clientId = document.getElementById('twClientId').value;
  const channel = document.getElementById('twChannel').value;
  if (!clientId || !channel) return;
  
  closeModal('twModal');
  
  // Salva configurazione
  localStorage.setItem('streamdock_tw', JSON.stringify({ clientId, channel }));
  state.tw.channel = channel;
  state.tw.clientId = clientId;
  
  // Connetti via IRC
  const ws = new WebSocket('wss://irc-ws.chat.twitch.tv:443');
  state.tw.ws = ws;
  
  ws.onopen = () => {
    ws.send('CAP REQ :twitch.tv/tags');
    ws.send('NICK justinfan123');
    ws.send(`JOIN #${channel}`);
    state.tw.connected = true;
    updateUI();
    addSystemMessage('tw', `✅ Twitch connesso al canale #${channel}`);
  };
  
  ws.onmessage = (event) => {
    const message = event.data;
    if (message.includes('PRIVMSG')) {
      const match = message.match(/:([^!]+)![^@]+@[^ ]+ PRIVMSG #[^ ]+ :(.+)/);
      if (match) {
        addMessage({
          platform: 'tw',
          author: match[1],
          text: match[2],
          timestamp: new Date()
        });
      }
    }
  };
  
  ws.onerror = (error) => {
    console.error('Twitch WebSocket error:', error);
    state.tw.connected = false;
    updateUI();
  };
}

// ========== UI HELPERS ==========
function addMessage(msg) {
  state.messages.unshift(msg);
  if (state.messages.length > 200) state.messages.pop();
  renderMessages();
}

function addSystemMessage(platform, text) {
  addMessage({ platform, author: '🔧 SYSTEM', text, timestamp: new Date() });
}

function renderMessages() {
  const feed = document.getElementById('chatFeed');
  const filtered = state.messages.filter(m => state.filter === 'all' || m.platform === state.filter);
  
  feed.innerHTML = filtered.map(msg => `
    <div class="msg">
      <div class="msg-platform ${msg.platform}">
        ${msg.platform === 'yt' ? '▶' : '🎮'}
      </div>
      <div class="msg-body">
        <div class="msg-meta">
          <span class="msg-author">${escapeHtml(msg.author)}</span>
          <span class="msg-time">${formatTime(msg.timestamp)}</span>
        </div>
        <div class="msg-text">${escapeHtml(msg.text)}</div>
      </div>
    </div>
  `).join('');
  
  document.getElementById('msgCount').textContent = `${filtered.length} msg`;
}

function updateUI() {
  // YouTube UI
  const ytCard = document.getElementById('ytCard');
  if (state.yt.connected) {
    ytCard.classList.add('connected-yt');
    document.getElementById('ytChannelName').textContent = state.yt.channelName || 'Live';
    document.getElementById('ytViewers').textContent = state.yt.viewers || '—';
    document.getElementById('ytBtn').textContent = 'Disconnect';
    document.getElementById('ytBtn').onclick = disconnectYouTube;
  } else {
    ytCard.classList.remove('connected-yt');
    document.getElementById('ytChannelName').textContent = '—';
    document.getElementById('ytViewers').textContent = '—';
    document.getElementById('ytBtn').textContent = 'Connect';
    document.getElementById('ytBtn').onclick = () => openModal('ytModal');
  }
  
  // Twitch UI
  const twCard = document.getElementById('twCard');
  if (state.tw.connected) {
    twCard.classList.add('connected-tw');
    document.getElementById('twChannelName').textContent = state.tw.channel || '—';
    document.getElementById('twViewers').textContent = state.tw.viewers || '—';
    document.getElementById('twBtn').textContent = 'Disconnect';
    document.getElementById('twBtn').onclick = disconnectTwitch;
  } else {
    twCard.classList.remove('connected-tw');
    document.getElementById('twChannelName').textContent = '—';
    document.getElementById('twViewers').textContent = '—';
    document.getElementById('twBtn').textContent = 'Connect';
    document.getElementById('twBtn').onclick = () => openModal('twModal');
  }
  
  const anyConnected = state.yt.connected || state.tw.connected;
  const statusEl = document.getElementById('statusLabel');
  statusEl.textContent = anyConnected ? '● LIVE' : '● OFFLINE';
  statusEl.className = anyConnected ? 'connection-status live' : 'connection-status';
  
  const total = (state.yt.viewers || 0) + (state.tw.viewers || 0);
  document.getElementById('totalViewers').textContent = total;
}

function disconnectYouTube() {
  state.yt.connected = false;
  state.yt.accessToken = null;
  localStorage.removeItem('streamdock_yt');
  updateUI();
  addSystemMessage('yt', '❌ YouTube disconnesso');
}

function disconnectTwitch() {
  if (state.tw.ws) state.tw.ws.close();
  state.tw.connected = false;
  localStorage.removeItem('streamdock_tw');
  updateUI();
  addSystemMessage('tw', '❌ Twitch disconnesso');
}

function setFilter(filter) {
  state.filter = filter;
  renderMessages();
  
  // Aggiorna stile bottoni
  ['all', 'yt', 'tw'].forEach(f => {
    const btn = document.getElementById(`f-${f}`);
    if (btn) btn.className = `filter-pill ${filter === f ? `active-${f}` : ''}`;
  });
}

// ========== UTILS ==========
function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function formatTime(date) {
  return new Date(date).toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
}

function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

// Esponi funzioni globali
window.connectYT = connectYT;
window.connectTwitch = connectTwitch;
window.openModal = openModal;
window.closeModal = closeModal;
window.setFilter = setFilter;
window.disconnectYouTube = disconnectYouTube;
window.disconnectTwitch = disconnectTwitch;
</script>
